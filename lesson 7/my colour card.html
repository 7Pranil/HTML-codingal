<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Colour Card</title>
    <!--internal css-->
    <style>
        *{
            font-size: 19px;
        }
        body{
            background-color: rgb(151, 222, 196);
        }
        h1{
            color: darkblue;
        }
        h2{
            color: chocolate;
        }
        p {
            color: blueviolet;
        }
        #about-me{
            background-color: aquamarine;
        }
        .my-details{
            color: darkgoldenrod;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>My colour card</h1>
    <!--inline css-->
    <p style="color: cyan;"><b>Hi! This is my very own webpage</b></p>
    <div id="about-me">
        <h2>About me</h2>
        <p class="my-details">My name is Pranil</p>
        <p class="my-details">My favourite colour is Cyan</p>
        <p class="my-details">My favourite subject is Maths</p>
        <p class="my-details">My favourite food is Maggi</p>
    </div>

    <h2>My favourite things</h2>
    <p>My favourite animal is Dog</p>
    <p>My favourite sport is Football</p>
    <p>My favourite thing to watch is Youtube</p>
</body>
</html>
