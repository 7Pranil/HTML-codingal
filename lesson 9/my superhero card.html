<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Superhero Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(30, 32, 34);
            color: magenta;
        }
        .hero-name {
            font-size: 60px;
            font-weight: bold;
            color:coral;
            text-shadow: 4px 4px Sagegreen;
        }
        .hero-description {
            font-style: italic;
            color: #d10000;
            text-transform: capitalize;
        }
        .label {
            color: #ff8787;
            text-transform: uppercase;
            text-decoration: underline;
        }
        .hero-power {
            font-weight: bold;
            color: #00fff7;
        }
        .hero-weakness {
            font-style: italic;
            text-decoration: line-through;
            color: #504d4d;
        }
        .badge     {
            color: #d4ff00;
            font-weight: bold;
            font-size: 28px;
            transform: rotate(15deg);
        }
        .made-by {
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1 class="hero-name">Thunder Kid</h1>
    <p class="hero-description">The most powerful superhero in the school.</p>
    <h2 class="label">Superpower</h2>
    <p class="hero-power">Very good at playing football.</p>
    <p class="hero-power">Can run very fast.</p>
    <h2 class="label">Weakness</h2>
    <p class="hero-weakness">Homework.</p>
    <p class="hero-weakness">Losing football matches.</p><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <p class="badge">TOP HERO</p>
    <p class="made-by">Made by: Pranil</p>
</body>
</html>
