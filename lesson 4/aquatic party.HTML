<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquatic Party</title>
</head>
<body>
    <center>
        <h1>Aquatic Party</h1>
        <h2>The ocean stage is ready!</h2>
        
        <p>Play the music and watch the aquatic animals swim through their beautiful underwater world.</p>
        <audio controls loop>
            <source src="audio.mp3" type="audio/mpeg">

        Your browser does not support the video tag
        </video>
        <p>This webpage uses the audio tag for music and the video tag to bring the aquatic animal adventure to life</p>
    </center>
