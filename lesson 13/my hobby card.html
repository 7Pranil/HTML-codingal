<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My hobby cards</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        .hobby-card {
            background-color: #414a54;
            border: 2px solid #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        body {
            background-color: #000000;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
        }

        h1 {
            color: #6f419b;
            text-align: center;
        }

        .hobby-card h3 {
            color: #b25555;
            font-weight: bold;
        }

        p {
            color: #ffffff;
            font-size: 20px;
        }

        </style>
</head>
<body>
    <h1>My Hobbies</h1>
    <div class="container">
    <div class="row">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>Drawing</h3>
                <p>I love sketching animals and comic characters!   </p>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>FOOTBALL!!!</h3>
                <p>I love playing football with my friends!</p>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>Reading</h3>
                <p>I love reading books and learning new things!</p>
            </div>
        </div>

        </div>
    </div>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

    </script>
</body>
</html>
